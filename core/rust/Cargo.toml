[package]
name = "uvs_core"
version = "0.1.0"
edition = "2021"
authors = ["Universal Video Studio Contributors"]
license = "MIT OR Apache-2.0"
description = "High-performance core engine for Universal Video Studio"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
rayon = "1.10"
lru = "0.12"
tempfile = "3.12"

[dev-dependencies]
proptest = "1.5"
