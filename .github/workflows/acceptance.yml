name: Clean-Room Acceptance Certification

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly clean-room validation

jobs:
  acceptance:
    name: Production Clean-Room Acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: sudo apt-get update && sudo apt-get install -y ffmpeg podman python3

      - name: Run Acceptance Script
        run: bash ./scripts/acceptance.sh

      - name: Upload Acceptance Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-reports
          path: |
            acceptance.json
            acceptance.html
