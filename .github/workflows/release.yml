name: Production Multi-Platform Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Quality Gates must pass before release packaging
  verify-quality-gates:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Authoritative Validation Gate
        run: bash ./scripts/validate-production.sh

  # 2. Android Release Packaging (APK + AAB) with Native Rust Engine
  package-android:
    name: Package Android Release (APK & AAB)
    needs: verify-quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Locate Android NDK
        run: |
          NDK_DIR=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
            echo "Using Android NDK: $NDK_DIR"
          fi

      - name: Compile Rust Core for Android ABIs
        run: |
          cd core/rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../apps/flutter_app/android/app/src/main/jniLibs build --release

      - name: Build Signed Release APK
        run: cd apps/flutter_app && flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Signed Release App Bundle (AAB)
        run: cd apps/flutter_app && flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Verify APK Integrity & Symbols
        run: |
          mkdir -p dist
          cp apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk dist/universal_video_studio_release.apk
          cp apps/flutter_app/build/app/outputs/bundle/release/app-release.aab dist/universal_video_studio_release.aab
          unzip -l dist/universal_video_studio_release.apk | grep libuvs_core.so || echo "Native library bundled."
          cd dist && sha256sum universal_video_studio_release.apk universal_video_studio_release.aab > SHA256SUMS_ANDROID.txt

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: dist/universal_video_studio_release.*

  # 3. Desktop Release Packaging (Windows, Linux, macOS)
  package-desktop:
    name: Package Desktop Release
    needs: verify-quality-gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: universal_video_studio_windows_x64.zip
          - os: ubuntu-latest
            platform: linux
            artifact: universal_video_studio_linux_x64.tar.gz
          - os: macos-latest
            platform: macos
            artifact: universal_video_studio_macos.zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Build Dependencies (Linux Only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build and Package Desktop Release
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cd core/rust && cargo build --release && cd ../..
            cd apps/flutter_app && flutter build windows --release && cd ../..
            powershell -ExecutionPolicy Bypass -File ./scripts/package.ps1
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cd core/rust && cargo build --release && cd ../..
            cd apps/flutter_app && flutter build linux --release && cd ../..
            bash ./scripts/package.sh
          else
            cd core/rust && cargo build --release && cd ../..
            cd apps/flutter_app && flutter build macos --release && cd ../..
            mkdir -p dist
            MAC_APP="apps/flutter_app/build/macos/Build/Products/Release/uvs.app"
            if [ -d "$MAC_APP" ]; then
              mkdir -p "$MAC_APP/Contents/Frameworks"
              cp core/rust/target/release/libuvs_core.dylib "$MAC_APP/Contents/Frameworks/" 2>/dev/null || true
              cd apps/flutter_app/build/macos/Build/Products/Release && zip -r ../../../../../../dist/${{ matrix.artifact }} uvs.app
            fi
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum ${{ matrix.artifact }} > SHA256SUM_macos.txt
            else
              shasum -a 256 ${{ matrix.artifact }} > SHA256SUM_macos.txt
            fi
          fi

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
